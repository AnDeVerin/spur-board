# Weekly StrykerJS mutation run over packages/core/src/domain. It reports a score only, with no
# threshold: a low score never fails it, so an issue from this workflow means the run itself broke.
# Run it locally with `pnpm exec stryker run`; the HTML report lands in reports/mutation/.
# The incremental file is cached between runs. GitHub evicts a cache unused for 7 days, and a miss
# means a full run; a dispatch refreshes the cache.
name: weekly-mutation

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-
      # GITHUB_ACTIONS=false keeps the github-actions and junit reporters out of Stryker's Vitest
      # runs. Keep the plain assignment: wrapping the command in `env` hides the stryker binary
      # from the unused-dependency check, which then flags the Stryker packages.
      - name: Mutation run
        run: GITHUB_ACTIONS=false pnpm exec stryker run
      - name: Job summary
        run: node scripts/mutation-summary.ts reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: error

  report:
    needs: [mutation]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Report the run
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_TITLE: Weekly mutation run failed
          NIGHTLY_SUMMARY: The weekly mutation workflow failed to produce a report.
        run: node scripts/nightly.ts needs
