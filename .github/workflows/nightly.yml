name: nightly-published-package

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:
    inputs:
      force_failure:
        description: Exercise the issue reporting path
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: nightly-published-package
  cancel-in-progress: false

jobs:
  published-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install and run published package
        env:
          FORCE_FAILURE: ${{ inputs.force_failure }}
        run: |
          if [[ "$FORCE_FAILURE" == 'true' ]]; then
            echo 'Forced failure for issue-reporting validation'
            exit 1
          fi
          npx --yes spur-board@latest --version
      - name: Report failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/nightly.ts
