# Shuffled tests on Node 24 and 26 plus a link check. The shuffle seed is the run id; reproduce a
# failing order locally with `--sequence.seed=<run id>` and shuffle on.
name: nightly-tests

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      force_failure:
        description: Exercise the issue reporting path
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    env:
      SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shuffled unit, integration and process tests
        run: pnpm exec vitest run --project unit --project integration --project process --sequence.shuffle --sequence.seed="$SEED"
      - name: Shuffled startup test
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run packages/cli/test/startup.test.ts --project startup --sequence.shuffle --sequence.seed="$SEED" --outputFile.junit=reports/junit-startup.xml
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-nightly-node-${{ matrix.node }}
          path: reports/
          retention-days: 7

  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Forced failure
        env:
          FORCE_FAILURE: ${{ inputs.force_failure }}
        run: |
          if [[ "$FORCE_FAILURE" == 'true' ]]; then
            echo 'Forced failure for issue-reporting validation'
            exit 1
          fi
      - name: Check links
        uses: docker://lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --no-progress README.md docs

  report:
    needs: [test, links]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Report the run
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_TITLE: Nightly tests or link check failed
          NIGHTLY_SUMMARY: 'The nightly shuffled tests or link check failed. Shuffle seed: ${{ github.run_id }}.'
        run: node scripts/nightly.ts needs
