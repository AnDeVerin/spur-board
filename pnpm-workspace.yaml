packages:
  - packages/*

# Supply chain: only install versions published at least 7 days ago, and fail
# the install if any dependency wants to run an install script.
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds:
  better-sqlite3: true

catalog:
  # typescript-eslint needs the TypeScript 6 API; `tsc` (typecheck) is TypeScript 7.
  typescript: npm:@typescript/typescript6@^6.0.2
  '@typescript/native': npm:typescript@^7.0.2
  '@types/node': ^24
  eslint: ^10.13.0
  typescript-eslint: ^8.72.0
  '@vitest/eslint-plugin': ^1.6.28
  '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
  prettier: ^3.9.10
  vitest: ^5.0.5
  knip: ^6.43.0
  yaml: ^2.9.1
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  zod: ^4.6.7
  fastify: ^5.12.2
  better-sqlite3: ^13.0.3
  '@types/better-sqlite3': ^9.6.0
  kysely: ^0.29.7
  commander: ^15.0.0
  '@commander-js/extra-typings': ^15.0.0
  '@slack/socket-mode': 3.1.0
  '@slack/web-api': 8.2.0
  '@secretlint/core': 13.1.0
  '@secretlint/secretlint-rule-preset-recommend': 13.1.0
  '@modelcontextprotocol/server': ^2.4.0
  '@modelcontextprotocol/client': ^2.4.0
  tsdown: 0.22.3

# GHSA-g3hv-75wg-m249 (moderate, minimatch < 11.0.1) reaches us only through the
# eslint and Stryker toolchains (@stryker-mutator/core 10.1.1 depends on
# minimatch ~10.2.4), which match our own glob patterns. The fixed minimatch 11.0.1
# and its new dependency are younger than minimumReleaseAge, so the override
# that removes it waits until they mature. #82 adds that override and drops this entry.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249

overrides:
  # typed-rest-client@2.3.1 (via @stryker-mutator/core) pins qs 6.15.1 exactly; drop
  # the override when typed-rest-client no longer pins a vulnerable qs.
  'typed-rest-client>qs': 6.16.2
